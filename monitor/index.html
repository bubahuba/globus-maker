<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Globus Maker — Globe Monitor</title>
		<style>
			:root {
				color-scheme: light;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				background: #f5f5f4;
			}

			#globe {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
			}

			#globe canvas {
				display: block;
			}

			#status {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				text-align: center;
				font-size: 0.95rem;
				color: #92400e;
				pointer-events: none;
				z-index: 2;
			}

			#status[hidden] {
				display: none;
			}

			#hint {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0.75rem;
				text-align: center;
				font-size: 0.75rem;
				color: rgba(68, 64, 60, 0.55);
				pointer-events: none;
				z-index: 2;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<div id="globe" aria-label="Globe preview"></div>
		<p id="status">Loading latest globe…</p>
		<p id="hint">Drag to orbit · scroll to zoom</p>
		<script type="module" src="./globe.js"></script>
	</body>
</html>
