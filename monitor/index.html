<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Globus Maker — Globe Monitor</title>
		<style>
			:root {
				color-scheme: dark;
			}

			* {
				box-sizing: border-box;
			}

			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				background: #000;
			}

			#globe {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
			}

			#globe canvas {
				display: block;
			}

			#status {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				text-align: center;
				font-size: 0.95rem;
				color: #e7e5e4;
				background: #000;
				pointer-events: none;
				z-index: 2;
			}

			#status[hidden] {
				display: none;
			}

			#hint {
				position: fixed;
				left: 0;
				right: 10.5rem;
				bottom: 0.75rem;
				text-align: center;
				font-size: 0.75rem;
				color: rgba(231, 229, 228, 0.45);
				pointer-events: none;
				z-index: 2;
			}

			#app-links {
				position: fixed;
				right: max(0.85rem, env(safe-area-inset-right));
				bottom: max(0.85rem, env(safe-area-inset-bottom));
				z-index: 3;
				display: flex;
				flex-direction: row;
				align-items: flex-end;
				gap: 0.65rem;
			}

			.app-link {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.35rem;
				width: 4.5rem;
				padding: 0.35rem 0.25rem 0.2rem;
				text-decoration: none;
				color: #e7e5e4;
				-webkit-tap-highlight-color: transparent;
				filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
			}

			.app-link:focus-visible {
				outline: 2px solid #e7e5e4;
				outline-offset: 3px;
				border-radius: 0.35rem;
			}

			.app-link .app-icon {
				display: block;
				width: 3.75rem;
				height: 3.75rem;
				border-radius: 0.85rem;
				object-fit: cover;
				background: transparent;
				box-shadow:
					0 0 0 0.5px rgba(28, 25, 23, 0.08),
					0 6px 16px rgba(28, 25, 23, 0.14);
				transition: transform 0.15s ease;
			}

			.app-link:hover .app-icon,
			.app-link:active .app-icon {
				transform: scale(0.94);
			}

			.app-link .app-label {
				display: block;
				width: 100%;
				text-align: center;
				font-size: 0.62rem;
				font-weight: 500;
				line-height: 1.15;
				letter-spacing: -0.01em;
				text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
				color: white;
			}

			#controls {
				position: fixed;
				top: max(0.75rem, env(safe-area-inset-top));
				right: max(0.75rem, env(safe-area-inset-right));
				z-index: 4;
				display: flex;
				flex-direction: row;
				align-items: center;
				gap: 0.5rem;
			}

			#preview-select {
				max-width: min(16rem, calc(100vw - 5.5rem));
				height: 2.25rem;
				padding: 0 0.65rem;
				border: 1px solid rgba(231, 229, 228, 0.28);
				border-radius: 0.55rem;
				background: rgba(28, 25, 23, 0.82);
				color: #e7e5e4;
				font: inherit;
				font-size: 0.78rem;
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
				box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
				cursor: pointer;
			}

			#preview-select:focus-visible {
				outline: 2px solid #e7e5e4;
				outline-offset: 2px;
			}

			#fullscreen-btn {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 2.25rem;
				height: 2.25rem;
				padding: 0;
				border: 1px solid rgba(231, 229, 228, 0.28);
				border-radius: 0.55rem;
				background: rgba(28, 25, 23, 0.82);
				color: #e7e5e4;
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
				box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
				cursor: pointer;
			}

			#fullscreen-btn:hover {
				background: rgba(41, 37, 36, 0.92);
			}

			#fullscreen-btn:focus-visible {
				outline: 2px solid #e7e5e4;
				outline-offset: 2px;
			}

			#fullscreen-btn[hidden] {
				display: none;
			}

			#fullscreen-btn svg {
				display: none;
				width: 1rem;
				height: 1rem;
			}

			#fullscreen-btn[aria-pressed='false'] #fullscreen-enter-icon,
			#fullscreen-btn[aria-pressed='true'] #fullscreen-exit-icon {
				display: block;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<div id="globe" aria-label="Globe preview"></div>
		<p id="status">Loading latest globe…</p>
		<p id="hint">Drag to orbit · scroll to zoom</p>
		<div id="controls">
			<label class="sr-only" for="preview-select">Saved globe preview</label>
			<select id="preview-select" aria-label="Globe preview">
				<option value="">Latest</option>
			</select>
			<button
				type="button"
				id="fullscreen-btn"
				aria-label="Enter fullscreen"
				aria-pressed="false"
				title="Enter fullscreen"
				hidden
			>
				<svg
					id="fullscreen-enter-icon"
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
				>
					<path d="M8 3H5a2 2 0 0 0-2 2v3" />
					<path d="M21 8V5a2 2 0 0 0-2-2h-3" />
					<path d="M3 16v3a2 2 0 0 0 2 2h3" />
					<path d="M16 21h3a2 2 0 0 0 2-2v-3" />
				</svg>
				<svg
					id="fullscreen-exit-icon"
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
				>
					<path d="M8 3v3a2 2 0 0 1-2 2H3" />
					<path d="M21 8h-3a2 2 0 0 1-2-2V3" />
					<path d="M3 16h3a2 2 0 0 1 2 2v3" />
					<path d="M16 21v-3a2 2 0 0 1 2-2h3" />
				</svg>
			</button>
		</div>
		<nav id="app-links" aria-label="Apps">
			<a
				class="app-link"
				href="https://partnercheck.huba.sk"
				rel="noopener noreferrer"
				aria-label="Try Partner Check"
			>
				<img
					class="app-icon"
					src="./partnercheck-app-icon.png"
					width="192"
					height="192"
					alt=""
				/>
				<span class="app-label">PartnerCheck</span>
			</a>
			<a
				class="app-link"
				href="https://globe.rgb.sk"
				rel="noopener noreferrer"
				aria-label="Try Globe Maker"
			>
				<img class="app-icon" src="./app-icon.png" width="192" height="192" alt="" />
				<span class="app-label">Globe Maker</span>
			</a>
		</nav>
		<script type="module" src="./globe.js?v=7"></script>
	</body>
</html>
