<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Globus Maker — Globe Monitor</title>
		<style>
			:root {
				color-scheme: light;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				background: #f5f5f4;
			}

			#globe {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
			}

			#globe canvas {
				display: block;
			}

			#status {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				text-align: center;
				font-size: 0.95rem;
				color: #92400e;
				pointer-events: none;
				z-index: 2;
			}

			#status[hidden] {
				display: none;
			}

			#hint {
				position: fixed;
				left: 0;
				right: 5.5rem;
				bottom: 0.75rem;
				text-align: center;
				font-size: 0.75rem;
				color: rgba(68, 64, 60, 0.55);
				pointer-events: none;
				z-index: 2;
			}

			#app-link {
				position: fixed;
				right: max(0.85rem, env(safe-area-inset-right));
				bottom: max(0.85rem, env(safe-area-inset-bottom));
				z-index: 3;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.35rem;
				width: 4.5rem;
				padding: 0.35rem 0.25rem 0.2rem;
				text-decoration: none;
				color: #1c1917;
				-webkit-tap-highlight-color: transparent;
				filter: drop-shadow(0 1px 2px rgba(28, 25, 23, 0.12));
			}

			#app-link:focus-visible {
				outline: 2px solid #292524;
				outline-offset: 3px;
				border-radius: 0.35rem;
			}

			#app-link .app-icon {
				display: block;
				width: 3.75rem;
				height: 3.75rem;
				border-radius: 0.85rem;
				object-fit: cover;
				background: #f5f5f4;
				box-shadow:
					0 0 0 0.5px rgba(28, 25, 23, 0.08),
					0 6px 16px rgba(28, 25, 23, 0.14);
				transition: transform 0.15s ease;
			}

			#app-link:hover .app-icon,
			#app-link:active .app-icon {
				transform: scale(0.94);
			}

			#app-link .app-label {
				display: block;
				width: 100%;
				text-align: center;
				font-size: 0.62rem;
				font-weight: 500;
				line-height: 1.15;
				letter-spacing: -0.01em;
				text-shadow: 0 0.5px 1px rgba(255, 255, 255, 0.7);
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<div id="globe" aria-label="Globe preview"></div>
		<p id="status">Loading latest globe…</p>
		<p id="hint">Drag to orbit · scroll to zoom</p>
		<a
			id="app-link"
			href="https://globe.rgb.sk"
			rel="noopener noreferrer"
			aria-label="Try Globe Maker"
		>
			<img class="app-icon" src="./app-icon.png" width="192" height="192" alt="" />
			<span class="app-label">try Globe Maker</span>
		</a>
		<script type="module" src="./globe.js"></script>
	</body>
</html>
